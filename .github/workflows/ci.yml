name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
  # The Release workflow runs CI on the commit it is about to release.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.swipl }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # ubuntu: the distribution package (9.0.x), the oldest version
        # Mutalog supports. ppa: the latest stable release.
        swipl: [ubuntu, ppa]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install SWI-Prolog
        run: |
          if [ "${{ matrix.swipl }}" = ppa ]; then
            sudo apt-add-repository -y ppa:swi-prolog/stable
          fi
          sudo apt-get update
          sudo apt-get install -y swi-prolog-nox
          swipl --version

      - name: Check pack.pl and CHANGELOG.md agree
        run: scripts/release-check.sh

      - name: Run tests
        run: swipl test/run.pl

      - name: List mutants of Mutalog itself
        run: bin/mutalog list --mutate 'prolog/**/*.pl' --check > /dev/null

      - name: Run the example project
        working-directory: test/project
        run: ../../bin/mutalog run

      # Install from this checkout as a pack, then run it the two ways a
      # pack user would: as an app (9.1.22 and later) or with -g.
      - name: Install as a pack
        run: swipl -g "pack_install('file://$GITHUB_WORKSPACE', [interactive(false)])" -t halt

      - name: Run the installed pack
        working-directory: test/project
        run: |
          swipl -g "use_module(library(mutalog))" -g mutalog:main -t 'halt(2)' -- run --reporters clear_text
          if [ "${{ matrix.swipl }}" = ppa ]; then
            swipl mutalog run --reporters clear_text
          fi
