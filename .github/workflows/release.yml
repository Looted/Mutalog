name: Release

# Publishes the version in pack.pl when it reaches master untagged.
#
#   1. Each pull request that changes what users see adds a changeset
#      (npm run changeset), a .changeset/*.md file naming the bump.
#   2. To release, run npm run version-packages in a pull request. It
#      consumes the changesets into the next version in package.json
#      and pack.pl and a dated CHANGELOG.md section. CI checks the
#      three agree.
#   3. Merging it to master runs this workflow. Pushes whose version is
#      already tagged stop after the first step.
#
# For an untagged version the workflow runs CI on the commit, creates
# the vX.Y.Z tag and GitHub release (notes from CHANGELOG.md) on it,
# and registers that archive with the SWI-Prolog pack server.
#
# Running it from the Actions tab retries a release that failed; it
# refuses a version that is already tagged. A vX.Y.Z tag pushed by hand
# runs the same checks and publish steps.
#
# The archive URL spells the repository in lower case. SWI-Prolog takes
# the pack name from that path segment and refuses to install when it
# differs from the name in pack.pl; GitHub serves either spelling.

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Check for an unreleased version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      release: ${{ steps.check.outputs.release }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the version and changelog
        id: check
        run: scripts/release-decide.sh

  ci:
    name: CI
    needs: check
    if: needs.check.outputs.release == 'true'
    uses: ./.github/workflows/ci.yml

  tag:
    name: Tag and create the release
    needs: [check, ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Write the release notes
        id: tag
        run: |
          version=$(scripts/release-check.sh)
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          scripts/release-notes.sh "$version" > "$RUNNER_TEMP/notes.md"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            # A release made by hand in the web UI: fill in empty notes.
            if [ -z "$(gh release view "$TAG" --json body --jq .body)" ]; then
              gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
            fi
          else
            gh release create "$TAG" --target "$GITHUB_SHA" \
              --title "Mutalog ${TAG#v}" --notes-file "$RUNNER_TEMP/notes.md"
          fi

  publish:
    name: Publish to the pack list
    needs: tag
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TAG: ${{ needs.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.tag }}

      - name: Install SWI-Prolog
        run: |
          sudo apt-add-repository -y ppa:swi-prolog/stable
          sudo apt-get update
          sudo apt-get install -y swi-prolog-nox
          swipl --version

      - name: Register the tagged archive
        run: |
          swipl -g "pack_install('https://github.com/Looted/mutalog/archive/${TAG}.zip', [interactive(false), inquiry(true), package_directory('/tmp/packs-url')])" -t halt

      - name: Install by name and run the example project
        run: |
          swipl -g "pack_install(mutalog, [interactive(false), package_directory('/tmp/packs-name')])" -t halt
          version=$(swipl -p pack=/tmp/packs-name -g "attach_packs('/tmp/packs-name'), pack_property(mutalog, version(V)), write(V)" -t halt)
          echo "Installed mutalog $version"
          test "v$version" = "$TAG"
          cd test/project
          swipl -p pack=/tmp/packs-name -g "attach_packs('/tmp/packs-name')" -g "use_module(library(mutalog))" -g mutalog:main -t 'halt(2)' -- run --reporters clear_text
