name: Release

# Publishes the version in pack.pl. To release:
#
#   1. In a pull request, bump version('X.Y.Z') in pack.pl and add a
#      '## X.Y.Z' section to CHANGELOG.md. CI checks the two agree.
#   2. Merge it, then run this workflow on master from the Actions tab.
#
# The workflow refuses a version whose tag already exists, creates the
# vX.Y.Z tag and GitHub release (notes from CHANGELOG.md) on the commit
# it checked, and registers that archive with the SWI-Prolog pack server.
#
# A vX.Y.Z tag pushed by hand runs the same checks and publish steps.
#
# The archive URL spells the repository in lower case. SWI-Prolog takes
# the pack name from that path segment and refuses to install when it
# differs from the name in pack.pl; GitHub serves either spelling.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    name: Check and tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the version and changelog
        id: tag
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=$(scripts/release-check.sh --tag "$GITHUB_REF_NAME")
          else
            if [ "$GITHUB_REF" != refs/heads/master ]; then
              echo "Run the release from master, not $GITHUB_REF_NAME." >&2
              exit 1
            fi
            version=$(scripts/release-check.sh --untagged)
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          scripts/release-notes.sh "$version" > "$RUNNER_TEMP/notes.md"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            # A release made by hand in the web UI: fill in empty notes.
            if [ -z "$(gh release view "$TAG" --json body --jq .body)" ]; then
              gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
            fi
          else
            gh release create "$TAG" --target "$GITHUB_SHA" \
              --title "Mutalog ${TAG#v}" --notes-file "$RUNNER_TEMP/notes.md"
          fi

  publish:
    name: Publish to the pack list
    needs: tag
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TAG: ${{ needs.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.tag }}

      - name: Install SWI-Prolog
        run: |
          sudo apt-add-repository -y ppa:swi-prolog/stable
          sudo apt-get update
          sudo apt-get install -y swi-prolog-nox
          swipl --version

      - name: Register the tagged archive
        run: |
          swipl -g "pack_install('https://github.com/Looted/mutalog/archive/${TAG}.zip', [interactive(false), inquiry(true), package_directory('/tmp/packs-url')])" -t halt

      - name: Install by name and run the example project
        run: |
          swipl -g "pack_install(mutalog, [interactive(false), package_directory('/tmp/packs-name')])" -t halt
          version=$(swipl -p pack=/tmp/packs-name -g "attach_packs('/tmp/packs-name'), pack_property(mutalog, version(V)), write(V)" -t halt)
          echo "Installed mutalog $version"
          test "v$version" = "$TAG"
          cd test/project
          swipl -p pack=/tmp/packs-name -g "attach_packs('/tmp/packs-name')" -g "use_module(library(mutalog))" -g mutalog:main -t 'halt(2)' -- run --reporters clear_text
